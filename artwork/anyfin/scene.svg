        <ellipse cx="445" cy="357" rx="197" ry="207" fill="url(#inner-light)" />
        <path d="M261 245C229 279 214 317 209 353" fill="none" stroke="#EAFFF8" stroke-width="11" stroke-linecap="round" />
        <path d="M671 296C687 329 692 365 699 396" fill="none" stroke="#FBC1F0" stroke-width="12" stroke-linecap="round" opacity=".88" />
        <g id="turn-surface"><path d="M274 588C307 610 350 617 389 606" fill="none" stroke="#E1C4FF" stroke-width="8" stroke-linecap="round" /></g>

        <path d="M266 251C285 228 309 212 336 199" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" opacity=".92" />
      </g>
  </g>
  <g id="turn-face">
    <g id="turn-eye-left">      <ellipse cx="395" cy="355" rx="27" ry="32" fill="#6338A4" />      <ellipse cx="402" cy="344" rx="6" ry="7" fill="#FFF6FF" /></g>
    <g id="turn-eye-right">      <ellipse cx="614" cy="326" rx="22" ry="29" fill="#6338A4" />      <ellipse cx="619" cy="316" rx="5" ry="6" fill="#FFF6FF" /></g>
    <g id="turn-mouth"><path d="M511 398L542 393" fill="none" stroke="#6338A4" stroke-width="13" stroke-linecap="round" /></g>
  </g>
</g>
    </g></g>
  </g>
