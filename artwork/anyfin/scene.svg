    <g clip-path="url(#turn-fin-clip)"><path d="M339 48C377 50 413 69 444 94" fill="none" stroke="#FFFDF8" stroke-width="15" stroke-linecap="round" /></g>
  </g>
  <g id="turn-body">
    <use href="#turn-body-shape" transform="translate(7 14)" fill="#35145E" opacity=".25"/>
    <use href="#turn-body-shape" fill="url(#jelly)"/>
    <path d="M535 170C559 184 579 195 597 207C650 238 680 283 697 345C710 392 714 426 736 456C758 484 765 506 755 532C744 569 720 590 691 594C659 600 626 586 603 575C594 570 589 571 581 580C549 608 507 610 466 595C453 590 447 595 439 605C412 629 373 636 335 629C296 625 268 612 251 594C245 587 240 586 229 593C204 605 177 603 155 590C129 575 120 553 123 524C125 496 137 475 154 455C178 427 188 405 193 370C198 316 215 269 249 235C269 216 290 205 309 193" fill="none" stroke="url(#glow-rim)" stroke-width="6"/>
