<g id="eye-right">      <ellipse cx="614" cy="326" rx="22" ry="29" fill="#6338A4" />      <ellipse cx="619" cy="316" rx="5" ry="6" fill="#FFF6FF" /></g>


      <path id="mouth" d="M511 398L542 393" fill="none" stroke="#6338A4" stroke-width="13" stroke-linecap="round" />
      <g id="happy-cheeks" fill="#F299D0" opacity="0">
        <ellipse cx="373" cy="399" rx="23" ry="10" transform="rotate(-8 373 399)"/>
        <ellipse cx="635" cy="369" rx="19" ry="9" transform="rotate(-8 635 369)"/>
      </g>
      <g id="happy-eyes" fill="none" stroke="#6338A4" stroke-width="12" stroke-linecap="round" opacity="0">
        <path id="happy-eye-left" d="M371 360Q394 320 419 354"/>
        <path id="happy-eye-right" d="M596 332Q613 296 632 326"/>
      </g></g><g id="mascot-turn" opacity="0">
