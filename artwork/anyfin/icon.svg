      <path d="M671 296C687 329 692 365 699 396" fill="none" stroke="#FBC1F0" stroke-width="12" stroke-linecap="round" opacity=".88" />
      <path d="M274 588C307 610 350 617 389 606" fill="none" stroke="#E1C4FF" stroke-width="8" stroke-linecap="round" />
      <path d="M339 48C377 50 413 69 444 94" fill="none" stroke="#FFFDF8" stroke-width="15" stroke-linecap="round" />
      <path d="M266 251C285 228 309 212 336 199" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" opacity=".92" />
