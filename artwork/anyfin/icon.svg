<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Anyfin — Afterglow</title>
  <desc id="desc">A luminous lavender jelly with pale mint and pink rim light, a soft violet aura and a restrained ground glow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#292235" />
      <stop offset=".48" stop-color="#1B1725" />
      <stop offset="1" stop-color="#101016" />
    </linearGradient>
    <radialGradient id="ambient" cx=".24" cy=".08" r=".88">
      <stop stop-color="#B39CF2" stop-opacity=".08" />
      <stop offset="1" stop-color="#B39CF2" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="jelly" gradientUnits="userSpaceOnUse" x1="370" y1="60" x2="514" y2="637">
      <stop offset="0" stop-color="#FFF2FF" />
      <stop offset="0.36" stop-color="#ECD8FF" />
      <stop offset="0.75" stop-color="#C4A0FA" />
      <stop offset="1" stop-color="#A879E8" />
    </linearGradient>
    <linearGradient id="pool" gradientUnits="userSpaceOnUse" x1="440" y1="526" x2="450" y2="640">
      <stop stop-color="#CAA3ED" stop-opacity=".3" />
      <stop offset="1" stop-color="#A775DA" stop-opacity=".7" />
    </linearGradient>
    <path id="jelly-shape" d="M309 193C328 164 338 146 342 124C347 95 338 79 322 63C306 47 313 31 335 29C373 23 417 44 451 70C485 95 510 136 535 170C559 184 579 195 597 207C650 238 680 283 697 345C710 392 714 426 736 456C758 484 765 506 755 532C744 569 720 590 691 594C659 600 626 586 603 575C594 570 589 571 581 580C549 608 507 610 466 595C453 590 447 595 439 605C412 629 373 636 335 629C296 625 268 612 251 594C245 587 240 586 229 593C204 605 177 603 155 590C129 575 120 553 123 524C125 496 137 475 154 455C178 427 188 405 193 370C198 316 215 269 249 235C269 216 290 205 309 193Z" />
    <clipPath id="jelly-clip">
      <use href="#jelly-shape" />
    </clipPath>
    <radialGradient id="aura">
      <stop stop-color="#9C60FF" stop-opacity=".43" />
      <stop offset=".58" stop-color="#8A45F0" stop-opacity=".2" />
      <stop offset="1" stop-color="#7131D0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ground-glow">
      <stop stop-color="#D6A4FF" stop-opacity=".42" />
      <stop offset="1" stop-color="#AB77E5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glow-rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E2C6FF" />
      <stop offset=".45" stop-color="#EAD9FF" />
      <stop offset="1" stop-color="#C385FA" />
    </linearGradient>
    <radialGradient id="inner-light">
      <stop stop-color="#FDEFFF" stop-opacity=".56" />
      <stop offset="1" stop-color="#FDEFFF" stop-opacity="0" />
    </radialGradient>
  </defs>
  <path fill="url(#background)" d="M0 0H512V512H0Z" />
  <path fill="url(#ambient)" d="M0 0H512V512H0Z" />
  <ellipse cx="259" cy="321" rx="250" ry="234" fill="url(#aura)" />
  <ellipse cx="260" cy="467" rx="175" ry="28" fill="url(#ground-glow)" />
