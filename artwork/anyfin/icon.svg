    <ellipse cx="395" cy="355" rx="27" ry="32" fill="#6338A4" />
    <ellipse cx="614" cy="326" rx="22" ry="29" fill="#6338A4" />
    <ellipse cx="402" cy="344" rx="6" ry="7" fill="#FFF6FF" />
    <ellipse cx="619" cy="316" rx="5" ry="6" fill="#FFF6FF" />
    <path d="M511 398L542 393" fill="none" stroke="#6338A4" stroke-width="13" stroke-linecap="round" />
