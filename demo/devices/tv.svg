<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <!-- A 16:9 TV with a thin bezel on a centre stand. #screen is where the app goes. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c44"/>
      <stop offset="1" stop-color="#18181d"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.07"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.02"/>
      <stop offset="0.46" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="hole">
      <rect width="1400" height="900" fill="#fff"/>
      <rect x="18" y="18" width="1364" height="767.25" rx="3" fill="#000"/>
    </mask>
    <filter id="blur" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <ellipse cx="700" cy="878" rx="330" ry="12" fill="#000" opacity="0.6" filter="url(#blur)"/>
  <path d="M652 803 H748 L760 864 H640 Z" fill="url(#stand)"/>
  <rect x="460" y="860" width="480" height="18" rx="9" fill="url(#stand)"/>
  <rect width="1400" height="803.25" rx="10" fill="url(#body)" mask="url(#hole)"/>
  <rect x="1" y="1" width="1398" height="801.25" rx="9" fill="none" stroke="#4a4a54" stroke-width="2"/>
  <rect x="18" y="18" width="1364" height="767.25" fill="url(#glare)"/>
  <rect id="screen" x="18" y="18" width="1364" height="767.25" rx="3" fill="none"/>
</svg>
