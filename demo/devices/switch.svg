<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440">
  <!-- A Nintendo Switch in handheld mode, neon blue and red Joy-Con. -->
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a9ec8"/>
      <stop offset="0.5" stop-color="#19b8e6"/>
      <stop offset="1" stop-color="#0fa7d3"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2402f"/>
      <stop offset="0.5" stop-color="#ff5847"/>
      <stop offset="1" stop-color="#d93424"/>
    </linearGradient>
    <radialGradient id="stick" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="1" stop-color="#1a1a1e"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.02"/>
      <stop offset="0.41" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="hole">
      <rect width="1000" height="440" fill="#fff"/>
      <rect x="180" y="35" width="640" height="360" rx="4" fill="#000"/>
    </mask>
    <filter id="blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <ellipse cx="500" cy="428" rx="470" ry="10" fill="#000" opacity="0.6" filter="url(#blur)"/>
  <path d="M152 8 H92 A82 82 0 0 0 10 90 V340 A82 82 0 0 0 92 422 H152 Z" fill="url(#left)"/>
  <path d="M848 8 H908 A82 82 0 0 1 990 90 V340 A82 82 0 0 1 908 422 H848 Z" fill="url(#right)"/>
  <rect x="148" y="8" width="704" height="414" rx="20" fill="#26262b" mask="url(#hole)"/>
  <rect x="149" y="9" width="702" height="412" rx="19" fill="none" stroke="#3d3d45" stroke-width="2"/>
  <rect x="180" y="35" width="640" height="360" fill="url(#glare)"/>
  <!-- left Joy-Con: minus, stick, arrows, capture -->
  <rect x="116" y="38" width="20" height="6" rx="3" fill="#15151a"/>
  <circle cx="80" cy="118" r="38" fill="#15151a"/>
  <circle cx="80" cy="118" r="29" fill="url(#stick)"/>
  <circle cx="80" cy="218" r="14" fill="#15151a"/>
  <circle cx="80" cy="282" r="14" fill="#15151a"/>
  <circle cx="48" cy="250" r="14" fill="#15151a"/>
  <circle cx="112" cy="250" r="14" fill="#15151a"/>
  <rect x="96" y="330" width="22" height="22" rx="5" fill="#15151a"/>
  <!-- right Joy-Con: plus, buttons, stick, home -->
  <rect x="864" y="38" width="20" height="6" rx="3" fill="#15151a"/>
  <rect x="871" y="31" width="6" height="20" rx="3" fill="#15151a"/>
  <circle cx="920" cy="86" r="14" fill="#15151a"/>
  <circle cx="920" cy="150" r="14" fill="#15151a"/>
  <circle cx="888" cy="118" r="14" fill="#15151a"/>
  <circle cx="952" cy="118" r="14" fill="#15151a"/>
  <circle cx="920" cy="250" r="38" fill="#15151a"/>
  <circle cx="920" cy="250" r="29" fill="url(#stick)"/>
  <circle cx="896" cy="340" r="13" fill="#15151a"/>
  <circle cx="896" cy="340" r="7" fill="none" stroke="#5a5a62" stroke-width="2"/>
  <rect id="screen" x="180" y="35" width="640" height="360" rx="4" fill="none"/>
</svg>
